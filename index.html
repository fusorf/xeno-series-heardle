<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xeno Series Heardle</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Background layer (blurred game artwork) -->
    <div id="backgroundLayer"></div>

    <div class="title-wrapper">
        <h1 id="pageTitle">Xeno Series Heardle</h1>
        <div class="endless-mode-label" id="endlessModeLabel">Endless Now</div>
        <div class="blitz-mode-label" id="blitzModeLabel"></div>
    </div>

    <!-- Mode selector tabs -->
    <div class="mode-selector" id="modeSelector">
        <!-- Tabs will be generated by JavaScript -->
    </div>

    <!-- Daily game indicator for Random mode -->
    <div class="daily-game-banner" id="dailyGameBanner" style="display: none;">
        <!-- Will show which game is selected in Random mode -->
    </div>

    <div class="game-container" id="gameContainer">
        <!-- Game content will be inserted here -->
    </div>

    <!-- Credits (bottom of page) -->
    <div class="credits-box" id="creditsBox">
        <!-- Will be populated by JavaScript -->
    </div>

    <!-- Version label (bottom-right corner) -->
    <div class="version-label" id="versionLabel"></div>

    <!-- Language selector (bottom-left corner) -->
    <div class="language-selector">
        <button class="lang-toggle" id="langToggle" onclick="toggleLanguageMenu()" title="Change language">🌐</button>
        <div class="lang-menu" id="langMenu" style="display: none;">
            <button class="lang-option" data-lang="en" onclick="selectLanguage('en')">EN</button>
            <button class="lang-option" data-lang="fr" onclick="selectLanguage('fr')">FR</button>
            <button class="lang-option" data-lang="ja" onclick="selectLanguage('ja')">JP</button>
        </div>
    </div>

    <!-- History button -->
    <button class="history-button" id="historyButton" onclick="showHistoryModal()" title="Statistics">📊</button>

    <!-- Endless mode button -->
    <button class="endless-button" id="endlessButton" onclick="toggleEndlessMode()" title="Endless Now">∞</button>

    <!-- Blitz mode button -->
    <button class="blitz-button" id="blitzButton" onclick="toggleBlitzMode()" title="Blitz"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></button>

    <!-- Version (auto-generated) -->
    <script src="js/version.js"></script>

    <!-- Constants -->
    <script src="js/constants.js"></script>

    <!-- Core data -->
    <script src="js/songs.js"></script>
    <script src="js/random.js"></script>

    <!-- Modules -->
    <script src="js/storage.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/player.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/blitz.js"></script>

    <!-- Main game logic -->
    <script src="js/game.js"></script>
</body>
</html>
